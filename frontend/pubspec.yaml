name: medi_vault
description: MediVault — secure medical records management for patients and healthcare providers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5
  file_picker: ^10.3.10
  flutter_secure_storage: ^10.0.0
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  image_picker: ^1.2.1
  http_parser: ^4.1.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_logo.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
